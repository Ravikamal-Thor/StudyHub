<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        .form-container{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .form-card{
            width:450px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0px 5px 20px rgba(0,0,0,0.15);
        }

        .form-card h1{
            text-align:center;
            color:#1e3a8a;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#666;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

<div class="form-container">

    <div class="form-card">

        <h1>Student Management System</h1>

        <p class="subtitle">
           <b> Admin Login Portal</b>
        </p>

        <form action="/login" method="POST">

            <label>Username</label>

            <input
                type="text"
                name="userid"
                placeholder="Enter Username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="passwordid"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
